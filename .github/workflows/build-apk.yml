name: Build EasyCap Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        run: |
          cd EasyCap-Mobile
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log || (echo "=== GRADLE ERROR SUMMARY ===" && grep -C 4 -E "e: |error:|FAILED" ../build.log && echo "=== LAST 80 LINES ===" && tail -n 80 ../build.log && exit 1)

      - name: Locate and Prepare APK
        run: |
          echo "=== Check APK output directory ==="
          find EasyCap-Mobile/app/build/ -name "*.apk"
          cp $(find EasyCap-Mobile/app/build/ -name "*.apk" | head -n 1) ./EasyCap-Mobile.apk
          ls -lh ./EasyCap-Mobile.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyCap-Mobile-APK
          path: EasyCap-Mobile.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: mobile-v1.0.0
          name: EasyCap Mobile v1.0.0 (Bản Cài Đặt Android APK)
          draft: false
          prerelease: false
          body: |
            ### 📱 EasyCap Mobile - Trợ Lý Dịch Màn Hình 1:1 & AI Copilot
            - **Tải file:** Nhấp vào `EasyCap-Mobile.apk` bên dưới để tải và cài đặt trực tiếp lên điện thoại Android.
          files: EasyCap-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
