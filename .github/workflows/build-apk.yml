name: Build EasyCap Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Gradle
        run: |
          cd EasyCap-Mobile
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          cp EasyCap-Mobile/app/build/outputs/apk/debug/app-debug.apk EasyCap-Mobile.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyCap-Mobile-APK
          path: EasyCap-Mobile.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: mobile-v1.0.0
          name: EasyCap Mobile v1.0.0 (Bản Cài Đặt Android APK)
          draft: false
          prerelease: false
          body: |
            ### 📱 EasyCap Mobile - Trợ Lý Dịch Màn Hình 1:1 & AI Copilot
            - **Tải file:** Nhấp vào `EasyCap-Mobile.apk` bên dưới để tải và cài đặt trực tiếp lên điện thoại Android.
            - **Tính năng nổi bật:**
              - 🫧 Bóng nổi thông minh đè lên mọi ứng dụng (Manga, Game, PDF, MXH).
              - 🔤 Dịch đè 1:1 tức thì với Google ML Kit OCR offline.
              - 🤖 Trợ lý AI Copilot giải bài, giải mã lỗi code và tóm tắt qua Gemini 2.0 Flash.
              - 🔄 Tự động đồng bộ cập nhật OTA từ máy tính sang điện thoại.
          files: EasyCap-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
